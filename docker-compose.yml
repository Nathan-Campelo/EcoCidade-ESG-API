services:
  app:
    image: ${IMAGE_NAME:-projeto-esg-api}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projeto-esg-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - projeto-esg-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: projeto-esg-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projeto-esg-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  projeto-esg-network:
    driver: bridge
