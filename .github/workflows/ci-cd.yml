name: CI-CD

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit and integration tests
        run: mvn -B clean test

      - name: Package application
        run: mvn -B package -DskipTests

  deploy-staging:
    name: Deploy to Render Staging
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Trigger Render staging deploy
        run: curl --fail --silent --show-error "${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}?ref=${{ github.sha }}"

  deploy-production:
    name: Deploy to Render Production
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Trigger Render production deploy
        run: curl --fail --silent --show-error "${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}?ref=${{ github.sha }}"
