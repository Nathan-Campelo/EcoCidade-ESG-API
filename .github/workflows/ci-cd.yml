name: CI-CD

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  id-token: write

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit and integration tests
        run: mvn -B clean test

      - name: Package application
        run: mvn -B package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecocidade-esg-api-jar
          path: target/*.jar

  deploy-staging:
    name: Deploy to Azure Staging
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ecocidade-esg-api-jar
          path: package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure staging app settings
        run: |
          az webapp config appsettings set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME_STAGING }}" \
            --settings \
              APP_ENVIRONMENT=staging \
              DB_URL="${{ secrets.AZURE_APPSETTING_DB_URL_STAGING }}" \
              DB_USERNAME="${{ secrets.AZURE_APPSETTING_DB_USERNAME_STAGING }}" \
              DB_PASSWORD="${{ secrets.AZURE_APPSETTING_DB_PASSWORD_STAGING }}"

      - name: Deploy jar to Azure Web App Staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_STAGING }}
          package: package/*.jar

      - name: Logout from Azure
        run: az logout

  deploy-production:
    name: Deploy to Azure Production
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ecocidade-esg-api-jar
          path: package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure production app settings
        run: |
          az webapp config appsettings set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }}" \
            --settings \
              APP_ENVIRONMENT=production \
              DB_URL="${{ secrets.AZURE_APPSETTING_DB_URL_PRODUCTION }}" \
              DB_USERNAME="${{ secrets.AZURE_APPSETTING_DB_USERNAME_PRODUCTION }}" \
              DB_PASSWORD="${{ secrets.AZURE_APPSETTING_DB_PASSWORD_PRODUCTION }}"

      - name: Deploy jar to Azure Web App Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }}
          package: package/*.jar

      - name: Logout from Azure
        run: az logout
